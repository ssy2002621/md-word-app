<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown 转 Word</title>
    <script>
      function loadScript(src) {
        return new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = src;
          script.onload = resolve;
          script.onerror = () => reject(new Error(`load failed: ${src}`));
          document.head.appendChild(script);
        });
      }

      async function loadScriptWithFallback(cdnSrc, localSrc) {
        try {
          await loadScript(cdnSrc);
        } catch (_err) {
          await loadScript(localSrc);
        }
      }

      function loadKatexCssWithFallback(cdnHref, localHref) {
        const cdnLink = document.createElement('link');
        cdnLink.rel = 'stylesheet';
        cdnLink.href = cdnHref;
        cdnLink.onerror = () => {
          const localLink = document.createElement('link');
          localLink.rel = 'stylesheet';
          localLink.href = localHref;
          document.head.appendChild(localLink);
        };
        document.head.appendChild(cdnLink);
      }

      window.mdDepsReady = (async () => {
        loadKatexCssWithFallback(
          'https://cdn.jsdelivr.net/npm/katex/dist/katex.min.css',
          './node_modules/katex/dist/katex.min.css'
        );

        await loadScriptWithFallback(
          'https://cdn.jsdelivr.net/npm/markdown-it/dist/markdown-it.min.js',
          './node_modules/markdown-it/dist/markdown-it.min.js'
        );
        await loadScriptWithFallback(
          'https://cdn.jsdelivr.net/npm/katex/dist/katex.min.js',
          './node_modules/katex/dist/katex.min.js'
        );
        await loadScriptWithFallback(
          'https://cdn.jsdelivr.net/npm/markdown-it-texmath/texmath.min.js',
          './node_modules/markdown-it-texmath/texmath.js'
        );
      })();
    </script>
    <style>
      :root {
        --bg: #f6f1e9;
        --panel: #fffdf8;
        --ink: #1c1c1c;
        --line: #d8cfc2;
        --accent: #0f766e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", "PingFang SC", sans-serif;
        color: var(--ink);
        background: radial-gradient(circle at 20% 10%, #fff7e8, var(--bg));
        min-height: 100vh;
      }

      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
        backdrop-filter: blur(4px);
      }

      .title {
        font-size: 16px;
        font-weight: 600;
      }

      .toolbar-actions {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .settings-group {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
      }

      #tableStyleSelect {
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 6px 8px;
        background: #fff;
      }

      #exportBtn {
        border: none;
        background: var(--accent);
        color: #fff;
        border-radius: 8px;
        padding: 10px 14px;
        cursor: pointer;
      }

      .layout {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        padding: 10px;
        height: calc(100vh - 58px);
      }

      #editor,
      #preview {
        width: 100%;
        height: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel);
      }

      #editor {
        resize: none;
        padding: 16px;
        font-size: 15px;
        line-height: 1.6;
      }

      #preview {
        overflow: auto;
        padding: 20px;
      }

      #preview table {
        width: auto;
        max-width: 100%;
        border-collapse: collapse;
        border-spacing: 0;
        margin: 12px auto;
      }

      #preview.preview-table-normal th,
      #preview.preview-table-normal td {
        border: 1px solid #222;
        padding: 6px 10px;
      }

      #preview.preview-table-minimal th,
      #preview.preview-table-minimal td {
        border: 0 !important;
        padding: 6px 10px;
      }

      #preview.preview-table-minimal table {
        border-top: 1.5px solid #111;
        border-bottom: 1.5px solid #111;
      }

      #preview.preview-table-minimal thead {
        border-bottom: 1.5px solid #111;
      }

      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
          grid-template-rows: 1fr 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <div class="title">Markdown -> Word (Pandoc)</div>
      <div class="toolbar-actions">
        <div class="settings-group">
          <label for="tableStyleSelect">设置 - 表格样式</label>
          <select id="tableStyleSelect">
            <option value="normal">标准 Word 表格（完整框线）</option>
            <option value="minimal">示例样式（上下外框线 + 格式行分隔线，无竖线）</option>
          </select>
        </div>
        <button id="exportBtn" type="button">导出 Word</button>
      </div>
    </div>

    <div class="layout">
      <textarea id="editor"># Hello

公式测试：

$$E = mc^2$$</textarea>
      <div id="preview"></div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
